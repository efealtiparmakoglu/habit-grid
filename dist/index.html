<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>habit grid — offline</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: ui-monospace, monospace;
    background: #101418; color: #d7dde3;
    display: flex; flex-direction: column; align-items: center;
    padding: 18px; margin: 0; gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #habit-list { display: flex; flex-direction: column; gap: 4px; text-align: left; }
  #habit-list label { display: flex; gap: 6px; align-items: center; }
  .add-row { display: flex; gap: 6px; margin-top: 6px; }
  input, select, button {
    font: inherit; background: #1b2129; color: #d7dde3;
    border: 1px solid #2c343c; padding: 4px 8px;
  }
  #year { width: 70px; }
  #grid { width: 100%; overflow-x: auto; }
  h2 { text-align: center; }
  table { border-collapse: collapse; width: 100%; background: white; color: #111; }
  th, td { border: 1px solid #999; padding: 4px 6px; font-size: 12px; }
  th { background: #e8e2d4; }
  td.check { min-width: 18px; height: 22px; }
  th.weekend, td.weekend { background: #f0e8d8; }
  #summary { color: #7fdc9c; }
</style>
</head>
<body>
  <h1>habit grid <small>(offline, printable)</small></h1>
  <div class="controls noprint">
    <input id="year" type="number" min="2000" max="2100" value="2026">
    <select id="month"></select>
    <button id="render">render</button>
    <button id="print">🖨 print</button>
  </div>
  <div id="habit-list" class="noprint"></div>
  <div id="grid"></div>
  <div id="summary" class="noprint"></div>
<script type="module">
// core.ts (inlined)
/* Pure logic: month/day math, grid generation, defaults. No DOM. */

export const MONTH_NAMES = [
  "January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December",
];

export const WEEKDAYS = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];

/** Days in a month (1-based month). Leap-year aware. */
export function daysInMonth(year        , month        )         {
  return new Date(year, month, 0).getDate();
}

/** ISO-ish weekday: 0 = Monday .. 6 = Sunday. */
export function firstWeekday(year        , month        )         {
  return (new Date(year, month - 1, 1).getDay() + 6) % 7;
}

                        
               
                
 

export const DEFAULT_HABITS          = [
  { name: "Exercise", color: "#2e7d32" },
  { name: "Read", color: "#1565c0" },
  { name: "Meditate", color: "#6a1b9a" },
  { name: "No sugar", color: "#c62828" },
];

/** Default month: the current month. Pure input → output. */
export function defaultYearMonth(now      )                                  {
  return { year: now.getFullYear(), month: now.getMonth() + 1 };
}

                           
               
                
                    
               
                       
                  
 

/** Build the printable grid spec. */
export function buildGrid(
  year        ,
  month        ,
  habits         ,
)           {
  if (month < 1 || month > 12) throw new Error("month must be 1..12");
  if (habits.length === 0) throw new Error("at least one habit required");
  return {
    year,
    month,
    monthName: MONTH_NAMES[month - 1]          ,
    days: daysInMonth(year, month),
    firstWeekday: firstWeekday(year, month),
    habits,
  };
}

/** Serialize the spec to markdown (export alternative). */
export function toMarkdown(spec          )         {
  const header = `# ${spec.monthName} ${spec.year} — habit grid\n`;
  const names = spec.habits.map((h) => h.name).join(", ");
  const table = [
    "| Habit | " + Array.from({ length: spec.days }, (_, i) => i + 1).join(" | ") + " |",
    "|" + "---|".repeat(spec.days + 1),
    ...spec.habits.map((h) => `| ${h.name} | ${" ".repeat(spec.days * 3 - 1)} |`),
  ];
  return `${header}\nHabits: ${names}\n\n${table.join("\n")}\n`;
}

/* DOM layer: month/habit inputs, printable grid with checkboxes,
 * add/remove habits, print button. */


const $ = (id        )              => document.getElementById(id)               ;

function readHabits()          {
  return [...document.querySelectorAll                  ("#habits input:checked")].map(
    (box) => ({ name: box.dataset.name ?? "", color: box.dataset.color ?? "#333" }),
  );
}

function habitControls()       {
  const container = $("habit-list");
  container.innerHTML = "";
  const all = [...DEFAULT_HABITS];
  const custom = localStorage.getItem("habit-custom");
  if (custom) {
    for (const name of JSON.parse(custom)            ) {
      all.push({ name, color: "#555" });
    }
  }
  for (const habit of all) {
    const label = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = true;
    box.dataset.name = habit.name;
    box.dataset.color = habit.color;
    label.appendChild(box);
    label.append(` ${habit.name}`);
    container.appendChild(label);
  }
  const addRow = document.createElement("div");
  addRow.className = "add-row";
  const input = document.createElement("input");
  input.placeholder = "custom habit…";
  const button = document.createElement("button");
  button.textContent = "add";
  button.addEventListener("click", () => {
    if (input.value.trim() === "") return;
    const saved = JSON.parse(localStorage.getItem("habit-custom") ?? "[]")            ;
    saved.push(input.value.trim());
    localStorage.setItem("habit-custom", JSON.stringify(saved));
    habitControls();
    render();
  });
  addRow.append(input, button);
  container.appendChild(addRow);
}

function render()       {
  const year = Number(($("year")                    ).value) || 2026;
  const month = Number(($("month")                     ).value) || 9;
  const habits = readHabits();
  if (habits.length === 0) {
    $("grid").innerHTML = "<p>select at least one habit</p>";
    return;
  }
  let spec;
  try {
    spec = buildGrid(year, month, habits);
  } catch (error) {
    $("grid").textContent = String(error);
    return;
  }

  const gridEl = $("grid");
  gridEl.innerHTML = "";
  const title = document.createElement("h2");
  title.textContent = `${spec.monthName} ${spec.year}`;
  gridEl.appendChild(title);

  const table = document.createElement("table");
  const headerRow = table.insertRow();
  headerRow.appendChild(document.createElement("th")).textContent = "habit";
  for (let day = 1; day <= spec.days; day++) {
    const th = document.createElement("th");
    th.textContent = String(day);
    if ((spec.firstWeekday + day - 1) % 7 >= 5) th.classList.add("weekend");
    headerRow.appendChild(th);
  }
  for (const habit of spec.habits) {
    const row = table.insertRow();
    row.insertCell().textContent = habit.name;
    for (let day = 1; day <= spec.days; day++) {
      const cell = row.insertCell();
      cell.classList.add("check");
      if ((spec.firstWeekday + day - 1) % 7 >= 5) cell.classList.add("weekend");
    }
  }
  gridEl.appendChild(table);
  ($("summary")               ).textContent =
    `${spec.days} days × ${spec.habits.length} habits — print me ✓`;
}

function setup()       {
  const now = new Date();
  ($("year")                    ).value = String(now.getFullYear());
  ($("month")                     ).value = String(now.getMonth() + 1);
  habitControls();
  render();
  $("year")?.addEventListener("input", render);
  $("month")?.addEventListener("change", render);
  $("print")?.addEventListener("click", () => window.print());
  $("render")?.addEventListener("click", render);
}

setup();

</script>
</body>
</html>
